steps:
  # 1. Construir la imagen del contenedor Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}'

  # 3. Desplegar Frontend en Cloud Run con IAP (--iap) habilitado directamente
  # Sizing para Demo: 2 vCPU, 4Gi RAM | Min Instancias: 1 | Max Instancias: 3
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--cpu'
      - '${_CPU}'
      - '--memory'
      - '${_MEMORY}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--ingress'
      - 'all'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--set-env-vars'
      - 'BACKEND_URL=${_BACKEND_URL}'

substitutions:
  _REGION: 'northamerica-south1'
  _REPO_NAME: 'summit-repo'
  _SERVICE_NAME: 'summit-frontend'
  _CPU: '2'
  _MEMORY: '4Gi'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '3'
  _SERVICE_ACCOUNT: 'summit-frontend-sa@cloud-summit-mx.iam.gserviceaccount.com'
  _BACKEND_URL: 'http://localhost:8080'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
